plugins {
    id 'com.android.application'
}

android {
    namespace 'com.anb.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.anb.launcher'
        minSdk 26
        targetSdk 35
        versionCode 39
        versionName '0.3.9'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
